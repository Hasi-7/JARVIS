<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brain UI — Personal AI Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="theme.css" />
<style>
  #root { height: 100vh; }
  /* boot splash */
  #boot { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg-0); z-index: 999; transition: opacity .4s ease; }
  #boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot"><div style="width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 38% 32%, oklch(0.74 0.115 230), transparent 70%);box-shadow:0 0 30px -6px oklch(0.74 0.115 230);animation:breathe 1.6s ease-in-out infinite"></div></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1b1d24"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="#4a9eff" stroke-width="2"/>
    <circle cx="50" cy="50" r="5" fill="#4a9eff"/>
    <circle cx="50" cy="50" r="22" fill="none" stroke="#4a9eff" stroke-width="1" stroke-dasharray="3 6" opacity="0.6"/>
  </svg>
</template>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="sphere.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="dashboard.jsx"></script>
<script type="text/babel" src="agent.jsx"></script>
<script type="text/babel" src="inbox.jsx"></script>
<script type="text/babel" src="stubs.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script>
  // hide boot splash once React mounts
  const obs = new MutationObserver(() => {
    if (document.querySelector('#root').children.length) {
      document.getElementById('boot').classList.add('gone');
      obs.disconnect();
    }
  });
  obs.observe(document.getElementById('root'), { childList: true });
  setTimeout(() => document.getElementById('boot')?.classList.add('gone'), 4000);
</script>
</body>
</html>
